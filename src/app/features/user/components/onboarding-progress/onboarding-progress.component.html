<div class="p-5 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
  <h3 class="text-sm font-semibold text-gray-800 dark:text-white/90 mb-4">
    Tu progreso inicial
  </h3>
  <ol class="space-y-3">
    @for (s of steps; track $index) {
      <li class="flex items-start gap-3">
        <div class="relative mt-0.5">
          <div class="h-5 w-5 rounded-full flex items-center justify-center text-[11px] font-medium"
            [ngClass]="$index < currentIndex ? 'bg-brand-500 text-white' : $index === currentIndex ? 'bg-brand-100 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400' : 'bg-gray-200 dark:bg-gray-800 text-gray-500'">
            {{ $index +1 }}
          </div>
        </div>
        <div class="flex-1">
          <p class="text-xs font-medium" [ngClass]="$index <= currentIndex ? 'text-gray-800 dark:text-white/90' : 'text-gray-500 dark:text-gray-500'">
            {{ s.label }}
          </p>
          <div class="mt-1 h-1 rounded-full bg-gray-200 dark:bg-gray-800 overflow-hidden">
            <div class="h-full bg-brand-500 transition-all" [style.width.%]="$index < currentIndex ? 100 : $index === currentIndex ? innerPercent : 0"></div>
          </div>
        </div>
      </li>
    }
  </ol>
</div>
